name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH → clone/pull → docker compose up
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            # First deploy: clone via HTTPS token. Every deploy after: pull.
            if [ ! -d "/opt/md-to-pdf/.git" ]; then
              git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Astrall-Digital/md-to-pdf.git /opt/md-to-pdf
            fi

            cd /opt/md-to-pdf
            git pull https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Astrall-Digital/md-to-pdf.git main

            # Write the app secret
            echo "ACCESS_KEY=${{ secrets.ACCESS_KEY }}" > .env

            # Build and start
            docker-compose up -d --build
            docker image prune -f
