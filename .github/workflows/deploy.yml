name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH → clone/pull → docker compose up
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            # First deploy: clone via HTTPS token. Every deploy after: pull.
            if [ ! -d "/opt/md-to-pdf/.git" ]; then
              git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Astrall-Digital/md-to-pdf.git /opt/md-to-pdf
            fi

            cd /opt/md-to-pdf
            # Match GitHub exactly (avoids "divergent branches" on git pull with newer Git)
            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Astrall-Digital/md-to-pdf.git
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Write the app secret (single quotes prevent bash from expanding $ chars)
            echo 'ACCESS_KEY=${{ secrets.ACCESS_KEY }}' > .env

            # Build and start
            docker-compose up -d --build
            docker image prune -f
