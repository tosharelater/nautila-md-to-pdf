services:
  md-to-pdf:
    build: .
    container_name: md-to-pdf
    restart: unless-stopped
    ports:
      - "3001:3000"          # host:container — access via http://your-vps:3001
    environment:
      - ACCESS_KEY=${ACCESS_KEY}   # read from .env file on the VPS
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - NODE_ENV=production
    volumes:
      - md_pdf_data:/app/data # persists history.json across container restarts
    # Puppeteer / Chromium needs these
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined

volumes:
  md_pdf_data:
